name: Build Android APK

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  build-android:
    name: Compilar APK con EAS
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Instalar dependencias
        run: npm install

      - name: Instalar EAS CLI
        run: npm install -g eas-cli

      - name: Crear .env
        run: |
          echo "EXPO_PUBLIC_WC_URL=${{ secrets.EXPO_PUBLIC_WC_URL }}" >> .env
          echo "EXPO_PUBLIC_WC_KEY=${{ secrets.EXPO_PUBLIC_WC_KEY }}" >> .env
          echo "EXPO_PUBLIC_WC_SECRET=${{ secrets.EXPO_PUBLIC_WC_SECRET }}" >> .env

      - name: Compilar APK con EAS
        run: eas build --platform android --profile preview --non-interactive --wait
        env:
          EXPO_TOKEN: ${{ secrets.EXPO_TOKEN }}

      - name: Descargar APK
        run: |
          URL=$(eas build:list --platform android --limit 1 --json --non-interactive | python3 -c "import sys,json; print(json.load(sys.stdin)[0]['artifacts']['buildUrl'])")
          curl -L "$URL" -o alcala-comics-staff.apk
        env:
          EXPO_TOKEN: ${{ secrets.EXPO_TOKEN }}

      - uses: actions/upload-artifact@v4
        with:
          name: alcala-comics-staff-apk
          path: alcala-comics-staff.apk
          retention-days: 30

      - uses: softprops/action-gh-release@v2
        with:
          tag_name: build-${{ github.run_number }}
          name: "App Staff v${{ github.run_number }}"
          files: alcala-comics-staff.apk
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
