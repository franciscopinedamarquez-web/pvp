name: Build Android APK

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  build-android:
    name: Compilar APK Android
    runs-on: ubuntu-latest

    steps:
      - name: Checkout código
        uses: actions/checkout@v4

      - name: Instalar Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Instalar Java 17 (necesario para Android)
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Instalar Android SDK
        uses: android-actions/setup-android@v3

      - name: Instalar dependencias npm
        run: npm ci

      - name: Instalar Expo CLI y EAS CLI
        run: npm install -g expo-cli eas-cli

      - name: Crear archivo .env con las claves de API
        run: |
          echo "EXPO_PUBLIC_WC_URL=${{ secrets.EXPO_PUBLIC_WC_URL }}" >> .env
          echo "EXPO_PUBLIC_WC_KEY=${{ secrets.EXPO_PUBLIC_WC_KEY }}" >> .env
          echo "EXPO_PUBLIC_WC_SECRET=${{ secrets.EXPO_PUBLIC_WC_SECRET }}" >> .env

      - name: Pre-build Expo (genera proyecto Android nativo)
        run: npx expo prebuild --platform android --clean
        env:
          EXPO_PUBLIC_WC_URL: ${{ secrets.EXPO_PUBLIC_WC_URL }}
          EXPO_PUBLIC_WC_KEY: ${{ secrets.EXPO_PUBLIC_WC_KEY }}
          EXPO_PUBLIC_WC_SECRET: ${{ secrets.EXPO_PUBLIC_WC_SECRET }}

      - name: Compilar APK de release
        run: |
          cd android
          chmod +x gradlew
          ./gradlew assembleRelease --no-daemon
        env:
          GRADLE_OPTS: "-Dorg.gradle.daemon=false -Dorg.gradle.configureondemand=true"

      - name: Localizar APK generado
        run: |
          find android -name "*.apk" -type f
          APK_PATH=$(find android -name "app-release-unsigned.apk" -o -name "app-release.apk" | head -1)
          echo "APK_PATH=$APK_PATH" >> $GITHUB_ENV
          cp "$APK_PATH" alcala-comics-staff.apk

      - name: Subir APK como artefacto descargable
        uses: actions/upload-artifact@v4
        with:
          name: alcala-comics-staff-apk
          path: alcala-comics-staff.apk
          retention-days: 30

      - name: Crear Release en GitHub con el APK
        uses: softprops/action-gh-release@v2
        with:
          tag_name: build-${{ github.run_number }}
          name: "App Staff v${{ github.run_number }}"
          body: |
            ## 📱 Alcalá Cómics Staff App

            ### Instalar en Android
            1. Descarga el archivo `alcala-comics-staff.apk`
            2. Ábrelo en tu móvil Android
            3. Si pide permiso para "instalar apps de fuentes desconocidas", acéptalo
            4. Instala y abre la app

            ### Usar en iPhone
            1. Instala **Expo Go** desde App Store
            2. Escanea el QR de desarrollo (pídelo al responsable técnico)

            ---
            Compilado automáticamente desde el commit `${{ github.sha }}`
          files: alcala-comics-staff.apk
          make_latest: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
